backend:
  name: github
  repo: RAKIaero/construtora-lindoia
  branch: main
  base_url: https://construtora-lindoia.vercel.app
  auth_endpoint: /api/auth
  commit_messages:
    create: 'conteúdo: cria {{collection}} "{{slug}}"'
    update: 'conteúdo: atualiza {{collection}} "{{slug}}"'
    delete: 'conteúdo: remove {{collection}} "{{slug}}"'
    uploadMedia: 'conteúdo: envia imagem {{path}}'
    deleteMedia: 'conteúdo: remove imagem {{path}}'

locale: 'pt'
site_url: https://construtora-lindoia.vercel.app
logo_url: https://construtora-lindoia.vercel.app/img/logo.webp

media_folder: 'public/img/uploads'
public_folder: '/img/uploads'

collections:
  - name: obras
    label: Obras
    label_singular: Obra
    folder: src/content/obras
    create: true
    identifier_field: titulo
    thumbnail: capa
    slug: '{{slug}}'
    fields:
      - { name: titulo, label: Título, widget: string }
      - { name: cliente, label: Cliente, widget: string }
      - name: segmento
        label: Segmento
        widget: select
        options:
          - { label: Agroindústria, value: agroindustria }
          - { label: Comercial e Varejo, value: comercial }
          - { label: Indústria, value: industria }
          - { label: Infraestrutura, value: infraestrutura }
      - { name: cidade, label: 'Cidade (ex: Sinop-MT)', widget: string, required: false }
      - { name: capa, label: 'Foto de capa', widget: image }
      - { name: fotos, label: 'Fotos da obra', widget: list, field: { name: foto, label: Foto, widget: image } }
      - { name: ordem, label: 'Ordem de exibição (menor aparece primeiro)', widget: number, default: 50 }
      - { name: destaque, label: 'Destacar na página inicial?', widget: boolean, default: false }
      - { name: body, label: 'Descrição da obra', widget: markdown }

  - name: produtos
    label: Produtos
    label_singular: Produto
    folder: src/content/produtos
    create: true
    identifier_field: nome
    thumbnail: imagem
    slug: '{{slug}}'
    fields:
      - { name: nome, label: Nome, widget: string }
      - { name: imagem, label: Imagem, widget: image }
      - { name: resumo, label: 'Resumo (1 frase)', widget: text }
      - { name: ordem, label: 'Ordem de exibição (menor aparece primeiro)', widget: number, default: 50 }

  - name: paginas
    label: 'Clientes e Depoimentos'
    files:
      - name: clientes
        label: 'Logos de clientes'
        file: src/data/clientes.json
        fields:
          - name: clientes
            label: Clientes
            widget: list
            fields:
              - { name: nome, label: Nome, widget: string }
              - { name: logo, label: Logo, widget: image }
      - name: depoimentos
        label: Depoimentos
        file: src/data/depoimentos.json
        fields:
          - name: depoimentos
            label: Depoimentos
            widget: list
            fields:
              - { name: texto, label: Depoimento, widget: text }
              - { name: autor, label: Autor, widget: string }
              - { name: empresa, label: 'Empresa / descrição', widget: string }
